# RentOps — proxied by the Mailcow nginx (copy to /opt/mailcow-dockerized/data/conf/nginx/rentops.conf)
server {
    listen 80;
    listen [::]:80;
    server_name rentops.mozweb.site www.rentopt.mozweb.site api.rentops.mozweb.site backend.rentops.mozweb.site;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /web;
    }
    location / { return 301 https://$host$request_uri; }
}

# Frontend (dashboard, portal, public QR pages); /api is proxied to the API by rentops-web.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rentops.mozweb.site www.rentopt.mozweb.site;

    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /web;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $rentops_web http://rentops-web:80;
        proxy_pass $rentops_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# API directly (https://api.rentops.mozweb.site/api/...)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.rentops.mozweb.site backend.rentops.mozweb.site;

    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=15768000" always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /web;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $rentops_api http://rentops-api:3000;
        proxy_pass $rentops_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
