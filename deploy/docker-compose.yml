# RentOps on the shared server. Public traffic arrives through the Mailcow nginx
# (see mailcow-rentops.conf), which reaches these containers over the Mailcow network.
name: rentops

services:
  db:
    image: postgres:16-alpine
    container_name: rentops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: equipment_rental
      POSTGRES_USER: rentops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentops -d equipment_rental"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: rentops-api
    container_name: rentops-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rentops:${POSTGRES_PASSWORD}@rentops-db:5432/equipment_rental?schema=public
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, mailcow]

  # Local LLM for the agents (CPU only). This server also runs Mailcow for another business, so the
  # model is capped to half the CPUs and a fixed amount of memory, and is reachable only by the API
  # on the internal network (no published port).
  ollama:
    image: ollama/ollama:0.35.0
    container_name: rentops-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time — agents queue instead of competing for CPU
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"        # keep the model in memory between requests
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    cpus: 2
    mem_limit: 6g

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: rentops-web
    container_name: rentops-web
    restart: unless-stopped
    depends_on: [api]
    networks: [internal, mailcow]

volumes:
  pgdata:
  ollama:

networks:
  internal:
  mailcow:
    external: true
    name: mailcowdockerized_mailcow-network
